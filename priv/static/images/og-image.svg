      <stop offset="0%" stop-color="#1a0f09"/>
      <stop offset="100%" stop-color="#2d1a0e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Sigil centered, scaled up -->
  <g transform="translate(510, 120) scale(2.8)">
    <path d="M12 16 C18 14, 24 18, 28 26 C30 30, 32 32, 32 32 C32 32, 34 34, 36 38 C40 46, 46 50, 52 48" stroke="#7b4a2c" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <path d="M52 16 C46 14, 40 18, 36 26 C34 30, 32 32, 32 32 C32 32, 30 34, 28 38 C24 46, 18 50, 12 48" stroke="#a0673e" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <path d="M32 8 C28 14, 26 22, 28 28 C30 32, 32 32, 32 32 C32 32, 34 32, 36 28 C38 22, 36 14, 32 8" stroke="#7b4a2c" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <circle cx="32" cy="32" r="4" fill="#a0673e"/>
    <circle cx="12" cy="16" r="2.5" fill="#7b4a2c"/>
    <circle cx="52" cy="16" r="2.5" fill="#a0673e"/>
    <circle cx="12" cy="48" r="2.5" fill="#a0673e"/>
    <circle cx="52" cy="48" r="2.5" fill="#7b4a2c"/>
    <circle cx="32" cy="8" r="2.5" fill="#7b4a2c"/>
  </g>

  <!-- Name -->
  <text x="600" y="440" text-anchor="middle" fill="#f5efe6" font-size="52" font-weight="bold" letter-spacing="2">Andrei Scripcaru</text>

  <!-- Title -->
  <text x="600" y="495" text-anchor="middle" fill="#a0673e" font-size="30" letter-spacing="4">SOFTWARE ENGINEER</text>

  <!-- Subtle bottom border -->
