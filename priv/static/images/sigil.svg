<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" aria-hidden="true">
  <!-- Abstract maker's mark: three flowing paths intersecting through a central node -->
  <!-- Path 1: Top-left to bottom-right flow -->
  <path
    d="M12 16 C18 14, 24 18, 28 26 C30 30, 32 32, 32 32 C32 32, 34 34, 36 38 C40 46, 46 50, 52 48"
    stroke="#1a0f09" stroke-width="4.5" stroke-linecap="round" fill="none"
  />
  <!-- Path 2: Top-right to bottom-left flow -->
  <path
    d="M52 16 C46 14, 40 18, 36 26 C34 30, 32 32, 32 32 C32 32, 30 34, 28 38 C24 46, 18 50, 12 48"
    stroke="#7b4a2c" stroke-width="4.5" stroke-linecap="round" fill="none"
  />
  <!-- Path 3: Vertical flow through center -->
  <path
    d="M32 8 C28 14, 26 22, 28 28 C30 32, 32 32, 32 32 C32 32, 34 32, 36 28 C38 22, 36 14, 32 8"
    stroke="#1a0f09" stroke-width="3.5" stroke-linecap="round" fill="none"
  />
  <!-- Central node -->
  <circle cx="32" cy="32" r="4" fill="#7b4a2c" />
  <!-- Accent dots at path endpoints -->
  <circle cx="12" cy="16" r="2.5" fill="#1a0f09" />
  <circle cx="52" cy="16" r="2.5" fill="#7b4a2c" />
  <circle cx="12" cy="48" r="2.5" fill="#7b4a2c" />
  <circle cx="52" cy="48" r="2.5" fill="#1a0f09" />
  <circle cx="32" cy="8" r="2.5" fill="#1a0f09" />
</svg>
